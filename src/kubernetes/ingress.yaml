apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinemaabyss-ingress
  namespace: cinemaabyss
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: cinemaabyss.example.com
      http:
        paths:
          # Маршрут для Events Service (прямой доступ для тестирования создания событий)
          - path: /api/events
            pathType: Prefix
            backend:
              service:
                name: events-service
                port:
                  number: 8082
          
          # Маршрут для основного API через Proxy Service (API Gateway)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: proxy-service
                port:
                  number: 8000
          
          # Маршрут для health checks
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: proxy-service
                port:
                  number: 8000
          
          # Корневой маршрут (для всех остальных запросов)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: proxy-service
                port:
                  number: 8000
